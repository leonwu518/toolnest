# 可选的 Cloudflare Pages 自动部署工作流
# 若已使用 Cloudflare Pages 的 Git 集成（方式 A），请勿同时启用本工作流，避免重复部署。
# 需要在仓库 Secrets/Variables 中配置：
#   CLOUDFLARE_API_TOKEN (Secret)  —— 含 Cloudflare Pages: Edit 权限的 API Token
#   CLOUDFLARE_ACCOUNT_ID (Secret) —— Cloudflare Account ID
#   SITE_URL (Variable)            —— 正式域名，例如 https://www.toolwild.com
#   CLOUDFLARE_PROJECT_NAME (Variable, 可选) —— Pages 项目名，默认 toolwild
#                                             注意：toolnest.pages.dev 已被第三方站点占用，不要使用项目名 toolnest
# 未配置上述两个 Secrets 时，工作流仍完成依赖安装、单元测试、构建与产物校验，仅跳过部署步骤（整体标记成功）。
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests and project integrity check
        run: npm test && npm run check:project

      - name: Build static site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Verify build output
        run: npm run verify

      - name: 跳过部署提示
        if: ${{ env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == '' }}
        run: echo "未配置 Cloudflare 凭据，已完成构建验证，跳过部署步骤。"

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name ${{ vars.CLOUDFLARE_PROJECT_NAME || 'toolwild' }} --branch main
